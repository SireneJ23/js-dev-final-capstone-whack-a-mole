<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Whack-A-Mole</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#14a604" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Whack-a-Mole" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="icon" href="./assets/tmole.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <nav class="wood-nav">
      <div class="logo">
        <img src="./assets/capstone.png" alt="Capstone Logo" />
      </div>
      <ul class="nav-menu">
        <li>
          <a
            href="https://github.com/SireneJ23/js-dev-final-capstone-whack-a-mole"
            target="_blank"
            rel="noopener noreferrer">
            <button class="nav-icon" id="aboutBut">
              <img src="./assets/about.png" alt="About / GitHub" />
            </button>
          </a>
        </li>
        <li>
          <button class="nav-icon" id="mixBut" title="Toggle Sound">
            <img src="./assets/sound.png" alt="Sound" />
          </button>
        </li>
        <li>
          <button class="nav-icon" id="exitBut" title="Exit Game">
            <img src="./assets/exit.png" alt="Exit" />
          </button>
        </li>
      </ul>
    </nav>
    <!-- ==========================
     SPLASH SCREEN
========================== -->
    <div id="splashScreen" class="splash-screen">
      <div class="splash-overlay"></div>

      <div class="splash-content">
        <img
          src="./assets/splash.png"
          alt="Whack-a-Mole Splash"
          class="splash-image" />

        <button id="enterGame" class="splash-start-btn">
          <img src="./assets/start.png" alt="Start Game" />
        </button>
      </div>
    </div>
    <div class="wrapper">
      <div class="header">
        <img src="./assets/title-plate.png" alt="Whack-a-Mole" id="title-img" />
      </div>
      <div id="scoreBoard">
        <div class="score-plate">
          <img src="./assets/plate.png" alt="Score Plate" />
          <div class="plate-text">
            <span>Score:</span>
            <span id="score">0</span>
          </div>
        </div>
        <div class="score-plate">
          <img src="./assets/plate.png" alt="Timer Plate" />
          <div class="plate-text">
            <span>Timer:</span>
            <span id="timer">30</span>
          </div>
        </div>
      </div>
      <div id="button">
        <div class="difficulty-row select-wrapper">
          <button type="button" id="difficulty-trigger" class="img-btn">
            <img
              src="./assets/selector.png"
              alt="Difficulty Plate"
              class="plate-bg" />
          </button>
          <div id="difficulty-list" class="custom-dropdown">
            <button
              type="button"
              class="img-btn"
              onclick="setDifficulty('easy', event)">
              <img src="./assets/easy.png" alt="Easy" />
            </button>
            <button
              type="button"
              class="img-btn"
              onclick="setDifficulty('normal', event)">
              <img src="./assets/normal.png" alt="Normal" />
            </button>
            <button
              type="button"
              class="img-btn"
              onclick="setDifficulty('hard', event)">
              <img src="./assets/hard.png" alt="Hard" />
            </button>
          </div>
          <select id="difficulty" style="display: none">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="controls-row">
          <button id="start" class="img-btn">
            <img src="./assets/start.png" alt="Start" />
          </button>
          <button id="pause" class="img-btn">
            <img src="./assets/pause.png" alt="Pause" />
          </button>
          <button id="stop" class="img-btn">
            <img src="./assets/stop.png" alt="Stop" />
          </button>
        </div>
      </div>
      <div class="grid">
        <div id="hole0" class="hole"><div id="mole0" class="mole"></div></div>
        <div id="hole1" class="hole"><div id="mole1" class="mole"></div></div>
        <div id="hole2" class="hole"><div id="mole2" class="mole"></div></div>
        <div id="hole3" class="hole"><div id="mole3" class="mole"></div></div>
        <div id="hole4" class="hole"><div id="mole4" class="mole"></div></div>
        <div id="hole5" class="hole"><div id="mole5" class="mole"></div></div>
        <div id="hole6" class="hole"><div id="mole6" class="mole"></div></div>
        <div id="hole7" class="hole"><div id="mole7" class="mole"></div></div>
        <div id="hole8" class="hole"><div id="mole8" class="mole"></div></div>
      </div>
    </div>
    <div class="footer">
      <h5>© 2026 Sirene J. All Rights Reserved</h5>
    </div>
    <div id="hammer" aria-hidden="true"></div>
    <div id="resultModal" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle">
        <h2 id="modalTitle" class="modal-title">Game Over</h2>
        <p id="modalMessage" class="modal-message"></p>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="modal-stat-label">Score</span>
            <span id="modalScore" class="modal-stat-value">0</span>
          </div>
          <div class="modal-stat">
            <span class="modal-stat-label">Target</span>
            <span id="modalTarget" class="modal-stat-value">0</span>
          </div>
        </div>
        <p id="diamondCallout" class="diamond-callout" hidden>
          💎 Diamond Hit!
        </p>
        <div class="modal-actions">
          <button id="playAgainBtn" class="img-btn modal-img-btn" type="button">
            <img src="./assets/play-again.png" alt="Play Again" />
          </button>
          <button
            id="closeModalBtn"
            class="img-btn modal-img-btn"
            type="button">
            <img src="./assets/close.png" alt="Close" />
          </button>
        </div>
      </div>
    </div>
    <audio id="introSound" src="./assets/thud-sound.wav" preload="auto"></audio>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="./src/index.js"></script>
  </body>
</html>
