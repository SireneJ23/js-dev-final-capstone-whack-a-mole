<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="wood-nav">
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>
      <ul class="nav-menu">
        <li class="nav-icon"><img src="assets/about_btn.png" alt="About" /></li>
        <li class="nav-icon"><img src="assets/sound_btn.png" alt="Sound" /></li>
        <li class="nav-icon"><img src="assets/exit_btn.png" alt="Exit" /></li>
      </ul>
    </nav>

    <div class="wrapper">
      <header class="header">
        <img src="assets/title.png" id="title-img" alt="Whack-a-Mole" />
      </header>

      <div id="scoreBoard">
        <div class="score-plate">
          <img src="assets/plate.png" alt="Score" />
          <div class="plate-text">Score: <span id="score">0</span></div>
        </div>
        <div class="score-plate">
          <img src="assets/plate.png" alt="Timer" />
          <div class="plate-text">Timer: <span id="timer">30</span></div>
        </div>
      </div>

      <div id="button">
        <div class="difficulty-row">
          <div class="select-wrapper">
            <img
              src="assets/plate_small.png"
              class="plate-bg"
              alt="Difficulty" />
            <select class="difficulty-select" id="difficulty">
              <option value="easy">EASY</option>
              <option value="normal" selected>NORMAL</option>
              <option value="hard">HARD</option>
            </select>
          </div>
        </div>

        <div class="controls-row">
          <button class="img-btn" id="start-btn">
            <img src="assets/start_btn.png" alt="Start" />
          </button>
          <button class="img-btn" id="pause-btn">
            <img src="assets/pause_btn.png" alt="Pause" />
          </button>
          <button class="img-btn" id="stop-btn">
            <img src="assets/stop_btn.png" alt="Stop" />
          </button>
        </div>
      </div>

      <div class="grid">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
      </div>

      <footer class="footer">&copy; 2026 Sirene J. All Rights Reserved</footer>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card">
        <h2 class="modal-title">Game Over</h2>
        <p class="modal-message">Great job whacking those moles!</p>
        <div class="modal-stats">
          <div class="modal-stat">
            <span class="modal-stat-label">SCORE</span>
            <span class="modal-stat-value" id="final-score">0</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-img-btn" id="play-again">
            <img src="assets/play_again.png" alt="Play Again" />
          </button>
          <button class="modal-img-btn" id="close-modal">
            <img src="assets/close_btn.png" alt="Close" />
          </button>
        </div>
      </div>
    </div>

    <div id="hammer"></div>

    <script src="js/script.js"></script>
  </body>
</html>
